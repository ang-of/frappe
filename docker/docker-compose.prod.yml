# Production stack for a plain VM (Compute Engine, or any Docker host).
# Reuses the same production image as Cloud Run (../Dockerfile +
# cloudrun-entrypoint.sh) but backs it with a MariaDB/Redis that live on
# this host instead of Cloud SQL/Memorystore. The entrypoint already checks
# whether the site's database exists and creates it only once, so it works
# unchanged against a persistent DB.
#
# Usage:
#   cd docker
#   cp .env.prod.example .env.prod   # fill in real secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Exposes the app on host port 80. Put a reverse proxy (Caddy/nginx) with
# TLS in front of it for anything beyond a quick test — not included here.

services:
  mariadb:
    image: mariadb:10.8
    restart: always
    env_file: .env.prod
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  lms:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    env_file: .env.prod
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      REDIS_CACHE: redis://redis:6379/0
      REDIS_QUEUE: redis://redis:6379/1
    ports:
      - "80:8080"

volumes:
  mariadb-data:
  redis-data:
