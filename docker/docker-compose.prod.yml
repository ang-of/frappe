# Production stack for a plain VM (Compute Engine, or any Docker host).
# Reuses the same production image as Cloud Run (../Dockerfile +
# cloudrun-entrypoint.sh) but backs it with a MariaDB/Redis that live on
# this host instead of Cloud SQL/Memorystore. The entrypoint already checks
# whether the site's database exists and creates it only once, so it works
# unchanged against a persistent DB.
#
# Usage:
#   cd docker
#   cp .env.prod.example .env.prod   # fill in real secrets, including LMS_IMAGE
#
#   Option A — build locally on this host:
#     docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
#   Option B — build elsewhere (Cloud Build) and just deploy the image here,
#   which avoids running the yarn/webpack build on a small VM:
#     gcloud builds submit --tag "$LMS_IMAGE" ..   # from the repo root, on your machine
#     docker compose --env-file .env.prod -f docker-compose.prod.yml pull lms
#     docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# Caddy terminates TLS (auto-issues a Let's Encrypt cert for CADDY_DOMAIN)
# and reverse-proxies to lms:8080. Needs ports 80 and 443 open on the host
# firewall — 80 is used for the ACME HTTP challenge, not just redirects.

services:
  mariadb:
    image: mariadb:10.8
    restart: always
    env_file: .env.prod
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  lms:
    image: ${LMS_IMAGE:-lms-local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    env_file: .env.prod
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      REDIS_CACHE: redis://redis:6379/0
      REDIS_QUEUE: redis://redis:6379/1

  caddy:
    image: caddy:2-alpine
    restart: always
    env_file: .env.prod
    depends_on:
      - lms
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mariadb-data:
  redis-data:
  caddy-data:
  caddy-config:
